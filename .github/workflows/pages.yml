name: Publicar Brújula Finanzas
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verificar JavaScript y reglas financieras
        run: |
          node --check app.js
          node --check finance-rules.mjs
          node --check planning-rules.mjs
          node --check planning-ui.mjs
          node --check statement-import.mjs
          node --check recurring-review.mjs
          node --check account-detail.mjs
          node --check install-helper.mjs
          node --check install-app.mjs
          node --check password-recovery.mjs
          node --test tests/*.test.mjs
      - name: Preparar únicamente archivos públicos de la aplicación
        run: |
          mkdir -p _site
          cp index.html styles.css app.js finance-rules.mjs planning-rules.mjs planning-ui.mjs statement-import.mjs recurring-review.mjs account-detail.mjs install-helper.mjs install-app.mjs password-recovery.mjs config.js manifest.webmanifest sw.js icon-192.png icon-512.png _site/
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
